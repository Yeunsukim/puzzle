# Render(인터넷 서버) 설정 파일 — Render 화면에서 "Blueprint"로 이 저장소를 고르면 자동으로 읽어요.
services:
  - type: web
    name: puzzle-friends
    runtime: node
    plan: free
    region: singapore          # 한국에서 가장 가까운 곳
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL      # Supabase 연결 주소 (Render 화면에서 직접 붙여 넣기)
        sync: false
      - key: GOOGLE_CLIENT_ID  # 구글 로그인을 쓸 때만 (없으면 비워 두기)
        sync: false
