    <path d="M-60 300 Q0 470 60 300 Z" fill="#FFB23E"/><path d="M-34 300 Q0 410 34 300 Z" fill="#FFE266"/>
    <!-- 날개 -->
    <path d="M-120 140 L-210 300 L-110 280 Z" fill="#FF6F91" stroke="#E04C74" stroke-width="8" stroke-linejoin="round"/>
    <path d="M120 140 L210 300 L110 280 Z" fill="#FF6F91" stroke="#E04C74" stroke-width="8" stroke-linejoin="round"/>
    <!-- 몸통 -->
    <path d="M0 -330 C120 -220 140 60 120 300 L-120 300 C-140 60 -120 -220 0 -330 Z" fill="#F4F1FF" stroke="#C9C0EE" stroke-width="8"/>
    <path d="M0 -330 C50 -290 78 -240 92 -190 L-92 -190 C-78 -240 -50 -290 0 -330 Z" fill="#FF6F91"/>
    <rect x="-122" y="220" width="244" height="40" fill="#79C6FF"/>
    <!-- 창문 속 고양이 -->
    <circle cx="0" cy="-40" r="100" fill="#BFE6FF" stroke="#79C6FF" stroke-width="16"/>
    <g transform="translate(0 -30)">
      <path d="M-70 -20 L-60 -90 L-20 -56 Z" fill="#B8B0C8" stroke="#8E86A6" stroke-width="5" stroke-linejoin="round"/>
      <path d="M70 -20 L60 -90 L20 -56 Z" fill="#B8B0C8" stroke="#8E86A6" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-58 -36 L-54 -74 L-32 -56 Z" fill="#FFC0D0"/><path d="M58 -36 L54 -74 L32 -56 Z" fill="#FFC0D0"/>
      <ellipse cx="0" cy="0" rx="76" ry="64" fill="#B8B0C8" stroke="#8E86A6" stroke-width="5"/>
      <path d="M-14 -60 v20 M0 -64 v22 M14 -60 v20" stroke="#8E86A6" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="-28" cy="-4" rx="10" ry="13" fill="#2B2340"/><ellipse cx="28" cy="-4" rx="10" ry="13" fill="#2B2340"/>
      <circle cx="-24" cy="-9" r="4" fill="#fff"/><circle cx="32" cy="-9" r="4" fill="#fff"/>
      <ellipse cx="-48" cy="20" rx="12" ry="7" fill="#FF8FA0" opacity=".7"/><ellipse cx="48" cy="20" rx="12" ry="7" fill="#FF8FA0" opacity=".7"/>
      <path d="M-7 14 h14 l-7 7 z" fill="#FF7A93"/>
      <path d="M0 21 q-8 10 -16 4 M0 21 q8 10 16 4" stroke="#2B2340" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="110" r="22" fill="#FFE266" stroke="#F2B620" stroke-width="6"/>
  </g>
  <!-- 꼬리 별 -->
  <g transform="translate(420 980) rotate(-30)">
    <path d="M0 0 L-260 30" stroke="#FFF3A8" stroke-width="12" stroke-linecap="round" opacity=".6"/>
    <use xlink:href="#st" transform="scale(1.6)"/>
  </g>
</svg>
