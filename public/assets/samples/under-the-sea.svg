      <path d="M-120 60 C-200 160 -150 260 -230 300"/><path d="M-60 90 C-80 200 -40 260 -90 330"/>
      <path d="M60 90 C80 200 40 260 90 330"/><path d="M120 60 C200 160 150 260 230 300"/>
