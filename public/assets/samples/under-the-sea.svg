      <path d="M10 -58 v116 M40 -48 v96" stroke="#fff" stroke-width="12" opacity=".55"/>
      <circle cx="-48" cy="-12" r="16" fill="#fff"/><circle cx="-52" cy="-12" r="9" fill="#2B2340"/><circle cx="-55" cy="-16" r="3" fill="#fff"/>
      <ellipse cx="-50" cy="18" rx="12" ry="7" fill="#FF8FA0" opacity=".7"/>
      <path d="M-80 10 q10 10 20 2" stroke="#2B2340" stroke-width="5" fill="none" stroke-linecap="round"/>
