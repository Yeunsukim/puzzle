<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1200" width="1600" height="1200">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE0F0"/><stop offset=".55" stop-color="#3FB4E0"/><stop offset="1" stop-color="#2A7EC4"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE3A8"/><stop offset="1" stop-color="#F5C77A"/></linearGradient>
    <radialGradient id="light" cx=".5" cy="0" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <g id="bubble"><circle r="22" fill="#fff" fill-opacity=".25" stroke="#fff" stroke-width="4" stroke-opacity=".8"/><circle cx="-8" cy="-8" r="5" fill="#fff" opacity=".9"/></g>
    <g id="fish">
      <path d="M70 0 L120 -40 L112 0 L120 40 Z" fill="currentColor" opacity=".85"/>
      <ellipse cx="0" cy="0" rx="90" ry="62" fill="currentColor"/>
