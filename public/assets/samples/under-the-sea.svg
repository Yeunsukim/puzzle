    <g fill="#FFC6DA"><circle cx="-210" cy="270" r="10"/><circle cx="-84" cy="290" r="10"/><circle cx="84" cy="290" r="10"/><circle cx="210" cy="270" r="10"/></g>
    <ellipse cx="0" cy="-20" rx="200" ry="180" fill="#FF9EC3" stroke="#F07AA6" stroke-width="8"/>
    <ellipse cx="-70" cy="-110" rx="40" ry="24" fill="#fff" opacity=".45"/>
    <ellipse cx="-66" cy="10" rx="28" ry="34" fill="#3A2340"/><ellipse cx="66" cy="10" rx="28" ry="34" fill="#3A2340"/>
    <circle cx="-56" cy="-4" r="11" fill="#fff"/><circle cx="76" cy="-4" r="11" fill="#fff"/>
    <ellipse cx="-120" cy="70" rx="34" ry="18" fill="#FF6F9A" opacity=".6"/><ellipse cx="120" cy="70" rx="34" ry="18" fill="#FF6F9A" opacity=".6"/>
    <path d="M-30 80 q30 30 60 0" stroke="#3A2340" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 물고기 -->
  <use xlink:href="#fish" transform="translate(300 320)" color="#FFC93C"/>
  <use xlink:href="#fish" transform="translate(1290 260) scale(-1 1) scale(.9)" color="#FF7F7F"/>
  <use xlink:href="#fish" transform="translate(1320 640) scale(.7)" color="#8E7BFF"/>
  <use xlink:href="#fish" transform="translate(280 760) scale(-.75 .75)" color="#4FE0B5"/>
  <use xlink:href="#fish" transform="translate(620 180) scale(.55)" color="#FF9E5E"/>
  <!-- 거품 -->
  <use xlink:href="#bubble" transform="translate(470 240)"/><use xlink:href="#bubble" transform="translate(510 170) scale(.7)"/>
  <use xlink:href="#bubble" transform="translate(1100 400) scale(1.3)"/><use xlink:href="#bubble" transform="translate(1140 320) scale(.8)"/>
  <use xlink:href="#bubble" transform="translate(940 160)"/><use xlink:href="#bubble" transform="translate(150 520) scale(.9)"/>
  <use xlink:href="#bubble" transform="translate(1500 460) scale(1.1)"/><use xlink:href="#bubble" transform="translate(1000 820) scale(.8)"/>
