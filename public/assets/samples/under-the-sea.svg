    <g id="star"><path d="M0 -60 L16 -18 L60 -18 L24 8 L38 52 L0 26 L-38 52 L-24 8 L-60 -18 L-16 -18 Z" fill="#FF9E5E" stroke="#E5763A" stroke-width="5" stroke-linejoin="round"/><circle cx="-12" cy="-6" r="5" fill="#4A3740"/><circle cx="12" cy="-6" r="5" fill="#4A3740"/><path d="M-8 10 q8 8 16 0" stroke="#4A3740" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="1600" height="1200" fill="url(#sea)"/>
  <rect width="1600" height="700" fill="url(#light)"/>
  <g fill="#fff" opacity=".12">
    <path d="M200 0 L320 0 L160 900 L60 900 Z"/><path d="M640 0 L720 0 L620 800 L540 800 Z"/><path d="M1100 0 L1220 0 L1300 900 L1180 900 Z"/>
  </g>
  <!-- 모래 -->
  <path d="M0 1000 C300 940 520 1010 800 980 C1080 950 1300 1010 1600 960 V1200 H0 Z" fill="url(#sand)"/>
  <g fill="#E9B567" opacity=".6"><circle cx="160" cy="1110" r="8"/><circle cx="420" cy="1060" r="6"/><circle cx="700" cy="1130" r="9"/><circle cx="980" cy="1080" r="7"/><circle cx="1280" cy="1140" r="8"/><circle cx="1480" cy="1050" r="6"/></g>
  <!-- 해초 -->
  <use xlink:href="#weed" transform="translate(90 1060)" color="#3CC48A"/>
  <use xlink:href="#weed" transform="translate(160 1080) scale(.8)" color="#2EA873"/>
  <use xlink:href="#weed" transform="translate(1460 1040) scale(1.1)" color="#3CC48A"/>
  <use xlink:href="#weed" transform="translate(1530 1060) scale(.75)" color="#58D69B"/>
  <use xlink:href="#weed" transform="translate(980 1000) scale(.6)" color="#2EA873"/>
